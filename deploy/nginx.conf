upstream mysweetplace_api {
	server 127.0.0.1:__API_PORT__;
	keepalive 16;
}

upstream mysweetplace_web {
	server 127.0.0.1:__WEB_PORT__;
	keepalive 16;
}

server {
	listen 80;
	listen [::]:80;
	server_name www.__DOMAIN__;
	return 301 $scheme://__DOMAIN__$request_uri;
}

server {
	listen 80;
	listen [::]:80;
	server_name __DOMAIN__;

	client_max_body_size 25m;
	server_tokens off;

	gzip on;
	gzip_vary on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location /api/ {
		proxy_pass http://mysweetplace_api;
		proxy_read_timeout 60s;
	}

	location = /up {
		access_log off;
		proxy_pass http://mysweetplace_api;
	}

	location / {
		# SvelteKit's preload Link and CSP headers can exceed nginx's default 4k buffer.
		proxy_buffer_size 16k;
		proxy_buffers 8 16k;
		proxy_busy_buffers_size 32k;
		proxy_pass http://mysweetplace_web;
	}
}
